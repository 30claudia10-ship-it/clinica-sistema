:root{
  color-scheme: light;
  --surface-100:#f6efe6;
  --surface-200:#fffdf9;
  --surface-300:#efe3d3;
  --line:#e2d6c8;
  --line-strong:#8c7c70;
  --ink:#2a2320;
  --ink-muted:#6b5e55;
  --seiva:#3f5b45;
  --on-seiva:#ffffff;
  --amora:#7a2e3b;
  --on-amora:#ffffff;
  --damasco:#e8a77e;
  --mel:#d9a441;
  --terracota:#b5573a;
  --on-terracota:#ffffff;
  --folha:#6e9a5b;
  --fase-coerencia:var(--mel);
  --fase-enraizar:var(--terracota);
  --fase-estruturar:var(--seiva);
  --fase-desenvolver:var(--folha);
  --fase-sustentar:var(--amora);
  --foco:#3f5b45;
  --space-1:4px;
  --space-2:8px;
  --space-3:16px;
  --space-4:24px;
  --space-5:40px;
  --space-6:64px;
  --radius-s:8px;
  --radius-m:16px;
  --radius-l:28px;
  --radius-full:999px;
  --sombra-suave:0 6px 24px rgba(42, 35, 32, 0.08);
  --fonte-titulo:"Fraunces", Georgia, serif;
  --fonte-texto:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    color-scheme: dark;
  --surface-100:#1e1a18;
  --surface-200:#2a2522;
  --surface-300:#352e2a;
  --line:#3e3632;
  --line-strong:#8a7b71;
  --ink:#f4ece3;
  --ink-muted:#b8aaa0;
  --seiva:#8db596;
  --on-seiva:#1e1a18;
  --amora:#d98a97;
  --on-amora:#1e1a18;
  --damasco:#e8a77e;
  --mel:#e0b25a;
  --terracota:#e08a6c;
  --on-terracota:#1e1a18;
  --folha:#9cc48a;
  --fase-coerencia:var(--mel);
  --fase-enraizar:var(--terracota);
  --fase-estruturar:var(--seiva);
  --fase-desenvolver:var(--folha);
  --fase-sustentar:var(--amora);
  --foco:#e8a77e;
  --sombra-suave:0 6px 24px rgba(0, 0, 0, 0.35);
  }
}
:root[data-tema="escuro"]{
  color-scheme: dark;
  --surface-100:#1e1a18;
  --surface-200:#2a2522;
  --surface-300:#352e2a;
  --line:#3e3632;
  --line-strong:#8a7b71;
  --ink:#f4ece3;
  --ink-muted:#b8aaa0;
  --seiva:#8db596;
  --on-seiva:#1e1a18;
  --amora:#d98a97;
  --on-amora:#1e1a18;
  --damasco:#e8a77e;
  --mel:#e0b25a;
  --terracota:#e08a6c;
  --on-terracota:#1e1a18;
  --folha:#9cc48a;
  --fase-coerencia:var(--mel);
  --fase-enraizar:var(--terracota);
  --fase-estruturar:var(--seiva);
  --fase-desenvolver:var(--folha);
  --fase-sustentar:var(--amora);
  --foco:#e8a77e;
  --sombra-suave:0 6px 24px rgba(0, 0, 0, 0.35);
}
*,*::before,*::after{box-sizing:border-box}
/* texto sobre damasco, mel e folha: tinta escura nos dois temas (ink vira claro no escuro) */
:root{--on-claro:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-tema=claro]){--on-claro:var(--surface-100)}}
:root[data-tema=escuro]{--on-claro:var(--surface-100)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--surface-100);color:var(--ink);font:400 1rem/1.5 var(--fonte-texto);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--fonte-titulo);font-weight:500;margin:0 0 var(--space-3)}
h1{font-size:clamp(2.25rem,7vw,3.5rem);line-height:1.07;letter-spacing:-.5px}      /* display-xl 56/60 */
h2{font-size:clamp(1.75rem,4.6vw,2.5rem);line-height:1.15}                           /* display-l 40/46 */
h3{font-size:1.625rem;line-height:1.23;font-weight:600}                              /* titulo 26/32 */
p{margin:0 0 var(--space-3)}
a{color:var(--seiva);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:var(--radius-s)}
.cx{width:min(1120px,100% - 2*var(--space-3));margin-inline:auto}
.cx-estreito{width:min(760px,100% - 2*var(--space-3))}
.pular{position:absolute;left:12px;top:-60px;background:var(--seiva);color:var(--on-seiva);padding:12px 18px;border-radius:var(--radius-full);z-index:100;font-weight:600}
.pular:focus{top:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border:2px solid var(--seiva);background:var(--seiva);color:var(--on-seiva);font:600 1rem var(--fonte-texto);border-radius:var(--radius-full);cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.6;cursor:wait}
.btn-sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-claro{background:var(--surface-100);color:var(--ink);border-color:var(--surface-100)}

/* topo */
.topo{position:sticky;top:0;z-index:50;background:var(--surface-100);border-bottom:1px solid var(--line)}
.topo-in{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:72px}
.marca{display:inline-flex;min-height:44px;align-items:center}
.marca img{height:36px;width:auto}
.topo nav{display:none}
.topo nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.topo nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:var(--ink);text-decoration:none;font-weight:500;border-radius:var(--radius-full)}
.topo nav a:hover{background:var(--surface-300)}
.btn-topo{min-height:44px;padding:8px 18px}
@media(min-width:900px){.topo nav{display:block}}

/* seções */
.sec{padding:var(--space-6) 0}.sec-alt{background:var(--surface-300)}
.lead{font-size:1.125rem;line-height:1.55;color:var(--ink-muted);max-width:60ch}
.grade2{display:grid;gap:var(--space-5);align-items:center}
@media(min-width:860px){.grade2{grid-template-columns:1.1fr .9fr}}
.abertura{padding:var(--space-5) 0 var(--space-6)}
.foto{margin:0;aspect-ratio:4/5;background:var(--surface-300);border-radius:var(--radius-l);position:relative;display:grid;place-items:center;overflow:hidden}
.foto .folha{position:absolute;width:70%;right:-10%;bottom:-8%;fill:var(--damasco)}
.foto-rotulo{position:relative;background:var(--surface-200);color:var(--ink);padding:8px 18px;border-radius:var(--radius-full);font-weight:600}

.cards{list-style:none;padding:0;margin:var(--space-5) 0;display:grid;gap:var(--space-3)}
@media(min-width:640px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.cards{grid-template-columns:repeat(4,1fr)}.cards3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface-200);border-radius:var(--radius-m);padding:var(--space-4);box-shadow:var(--sombra-suave)}
.card p:last-child{margin-bottom:0}
.card h3{font-size:1.375rem}
.parte{font-weight:600;color:var(--ink-muted);margin-bottom:var(--space-2)}
.bloco-damasco{background:var(--damasco);color:var(--on-claro);border-radius:var(--radius-l);padding:var(--space-5) var(--space-4)}
.bloco-damasco .lead{color:var(--on-claro)}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-2);padding:0;margin:0}
.chips li{background:var(--surface-200);color:var(--ink);padding:10px 20px;border-radius:var(--radius-full);font-weight:600}
.bloco-podcast{display:grid;gap:var(--space-4);align-items:center}
@media(min-width:860px){.bloco-podcast{grid-template-columns:1.4fr 1fr;padding:var(--space-5)}}
.botoes{display:flex;flex-wrap:wrap;gap:12px}
.bloco-podcast .btn{background:var(--on-claro);border-color:var(--on-claro);color:var(--damasco)}
.bloco-podcast .btn-sec{background:transparent;color:var(--on-claro)}

/* árvore: cada ciclo com a cor e o texto da sua fase */
.arvore{list-style:none;margin:var(--space-5) 0 0;padding:0;position:relative}
.arvore::before{content:"";position:absolute;left:23px;top:10px;bottom:10px;width:6px;border-radius:var(--radius-full);background:var(--line-strong);opacity:.5}
.ciclo{position:relative;padding-left:72px;margin-bottom:20px}
.no{position:absolute;left:0;top:14px;width:52px;height:52px;border-radius:50%;background:var(--cor);color:var(--on-cor);display:grid;place-items:center;font:600 1.375rem var(--fonte-titulo)}
.ciclo .card{border-left:8px solid var(--cor)}
.ciclo[data-fase=coerencia]{--cor:var(--fase-coerencia);--on-cor:var(--on-claro)}
.ciclo[data-fase=enraizar]{--cor:var(--fase-enraizar);--on-cor:var(--on-terracota)}
.ciclo[data-fase=estruturar]{--cor:var(--fase-estruturar);--on-cor:var(--on-seiva)}
.ciclo[data-fase=desenvolver]{--cor:var(--fase-desenvolver);--on-cor:var(--on-claro)}
.ciclo[data-fase=sustentar]{--cor:var(--fase-sustentar);--on-cor:var(--on-amora)}
@media(min-width:860px){
  .arvore::before{left:50%;transform:translateX(-50%)}
  .ciclo{width:50%;padding:0 56px 0 0}
  .ciclo:nth-child(even){margin-left:50%;padding:0 0 0 56px}
  .no{left:auto;right:-26px}.ciclo:nth-child(even) .no{right:auto;left:-26px}
}

/* equipe */
.equipe{display:grid;gap:20px;margin-top:var(--space-4)}
@media(min-width:700px){.equipe{grid-template-columns:1fr 1fr}}
.avatar{aspect-ratio:1;max-width:220px;border-radius:50%;background:var(--damasco);color:var(--on-claro);display:grid;place-items:center;text-align:center;font-weight:600;margin-bottom:var(--space-3)}

/* turma */
.selo{display:inline-block;background:var(--surface-200);color:var(--ink);border:2px solid var(--ink);padding:2px 14px;border-radius:var(--radius-full);font-weight:600;margin-right:var(--space-2)}
.aviso{color:var(--ink-muted)}
.lista-ok{list-style:none;padding:0;margin:0}
.lista-ok li{padding:10px 0 10px 32px;position:relative;border-bottom:1px solid var(--line)}
.lista-ok li:last-child{border:0}
.lista-ok li::before{content:"";position:absolute;left:0;top:18px;width:14px;height:14px;background:var(--seiva);border-radius:0 100% 0 100%}

/* formulário */
.form{display:grid;gap:14px}
.campo label{display:block;font-weight:600;margin-bottom:6px}
.campo input:not([type=checkbox]){width:100%;min-height:48px;padding:10px 16px;font:inherit;color:var(--ink);background:var(--surface-100);border:2px solid var(--line-strong);border-radius:var(--radius-s)}
.campo input::placeholder{color:var(--ink-muted);opacity:1}
.campo input[aria-invalid=true]{border-color:var(--amora)}
.check{display:grid;grid-template-columns:28px 1fr;column-gap:10px}
.check input{width:24px;height:24px;margin-top:4px;accent-color:var(--seiva)}
.check label{font-weight:400;margin:0}
.check .erro{grid-column:2}
.erro{color:var(--amora);font-weight:600;margin:6px 0 0}
.erro:empty{display:none}
.isca{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.status{font-weight:600;margin:0}.status.ok{color:var(--seiva)}.status.falha{color:var(--amora)}

/* faq */
.faq{background:var(--surface-200);border-radius:var(--radius-m);padding:4px 22px;margin-bottom:12px;box-shadow:var(--sombra-suave)}
.faq summary{cursor:pointer;min-height:56px;display:flex;align-items:center;font-weight:600;list-style:none;padding:8px 0}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;padding-left:12px;font-size:1.6rem;color:var(--seiva)}
.faq[open] summary::after{content:"−"}
.faq p{color:var(--ink-muted)}

/* fechamento / rodapé */
.fechamento{background:var(--amora);color:var(--on-amora);text-align:center;padding:96px 0}
.fechamento h2{max-width:18ch;margin:0 auto var(--space-4)}
.rodape{background:var(--seiva);color:var(--on-seiva);padding:var(--space-5) 0 96px}
.rodape a{color:var(--on-seiva)}
.rodape-in img{height:44px;width:auto;margin-bottom:20px}
.contatos{list-style:none;padding:0;margin:0 0 20px;display:flex;flex-wrap:wrap;gap:8px 28px}
.contatos a{display:inline-flex;align-items:center;min-height:44px}
.aviso-rodape{margin:0}
/* no escuro, seiva vira verde claro: o logo negativo (branco) precisa de fundo escuro */
@media(prefers-color-scheme:dark){.rodape{background:var(--surface-300);color:var(--ink)}.rodape a{color:var(--ink)}}

/* whatsapp */
.zap{position:fixed;right:var(--space-3);bottom:var(--space-3);width:56px;height:56px;border-radius:50%;background:var(--seiva);color:var(--on-seiva);display:grid;place-items:center;box-shadow:var(--sombra-suave);z-index:60}

/* modal */
dialog{border:0;padding:0;border-radius:var(--radius-l);background:var(--surface-200);color:var(--ink);width:min(480px,100% - 32px);box-shadow:var(--sombra-suave)}
dialog::backdrop{background:rgba(30,26,24,.6)}
.modal-in{padding:var(--space-4);position:relative}
.modal-in h2{font-size:1.75rem;padding-right:48px}
.fechar{position:absolute;right:12px;top:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-300);color:var(--ink);font-size:1.6rem;cursor:pointer}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

    '<figure class="foto" role="img" aria-label="'+a.fotoAlt+'"><span class="foto-rotulo">'+a.fotoRotulo+'</span>'+leaf+'</figure></div></section>';

  html += '<section id="para-quem" class="sec"><div class="cx"><h2>'+p.titulo+'</h2><p class="lead">'+p.texto+'</p>'+
    '<ul class="cards">'+p.momentos.map(function(m){return '<li class="card"><h3>'+m[0]+'</h3><p>'+m[1]+'</p></li>'}).join('')+'</ul>'+
    '<div class="bloco-damasco"><h3>'+p.conquistasTitulo+'</h3><ul class="chips">'+p.conquistas.map(function(c){return '<li>'+c+'</li>'}).join('')+'</ul></div></div></section>';

  html += '<section id="como-funciona" class="sec sec-alt"><div class="cx"><h2>'+j.titulo+'</h2><p class="lead">'+j.texto+'</p>'+
    '<ol class="arvore">'+j.ciclos.map(function(c,i){return '<li class="ciclo" data-fase="'+c.fase+'"><span class="no" aria-hidden="true">'+(i+1)+'</span>'+
      '<div class="card"><p class="parte">'+c.parte+' · '+c.duracao+'</p><h3>'+c.nome+'</h3><p>'+c.texto+'</p></div></li>'}).join('')+'</ol></div></section>';

  html += '<section id="programa" class="sec"><div class="cx"><h2>'+r.titulo+'</h2><ul class="cards cards3">'+
    r.itens.map(function(i){return '<li class="card"><h3>'+i[0]+'</h3><p>'+i[1]+'</p></li>'}).join('')+'</ul></div></section>';

  html += '<section id="equipe" class="sec sec-alt"><div class="cx"><h2>'+e.titulo+'</h2><div class="equipe">'+
    e.pessoas.map(function(x){return '<article class="card pessoa"><div class="avatar" role="img" aria-label="'+x.fotoAlt+'"><span>foto a definir</span></div><h3>'+x.nome+'</h3><p class="parte">'+x.papel+'</p><p>'+x.bio+'</p></article>'}).join('')+'</div></div></section>';

  html += '<section id="podcast" class="sec"><div class="cx"><div class="bloco-damasco bloco-podcast"><div><h2>'+pod.titulo+'</h2><p class="lead">'+pod.texto+'</p></div><div class="botoes">'+
    pod.botoes.map(function(b,i){return '<a class="btn '+(i?'btn-sec':'')+'" href="'+C.contato[b[1]]+'" target="_blank" rel="noopener">'+b[0]+'</a>'}).join('')+'</div></div></div></section>';

  html += '<section id="turma" class="sec sec-alt"><div class="cx grade2"><div><h2>'+f.titulo+'</h2><p class="lead">'+f.texto+'</p><p class="vagas"><span class="selo">'+f.vagas+'</span> <strong>'+f.preco+'</strong></p>'+
    '<p class="aviso">'+f.aviso+'</p>'+btnLista(C.botaoLista)+'</div>'+
    '<div class="card"><h3>O que inclui</h3><ul class="lista-ok">'+f.inclui.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul></div></div></section>';

  html += '<section id="guia" class="sec"><div class="cx grade2"><div><h2>'+g.titulo+'</h2><p class="lead">'+g.texto+'</p></div><div class="card">'+form('guia','guia-gratuito',g.botao)+'</div></div></section>';

  html += '<section id="perguntas" class="sec sec-alt"><div class="cx cx-estreito"><h2>'+q.titulo+'</h2>'+
    q.itens.map(function(i){return '<details class="faq"><summary>'+i[0]+'</summary><p>'+i[1]+'</p></details>'}).join('')+'</div></section>';

  html += '<section class="fechamento"><div class="cx"><h2>'+fe.titulo+'</h2>'+btnLista(fe.botao,'btn-claro')+'</div></section>';
  $('#conteudo').innerHTML = html;

  // Rodapé
  var ct = C.contato;
  $('#rodape').innerHTML = '<div class="cx rodape-in">'+logo('plena-logo-negativo','Plena')+
    '<ul class="contatos"><li><a href="'+ct.instagram+'" target="_blank" rel="noopener">Instagram '+ct.instagramRotulo+'</a></li>'+
    '<li><a href="https://wa.me/'+ct.whatsappNumero+'" target="_blank" rel="noopener">WhatsApp</a></li>'+
    '<li><a href="mailto:'+ct.email+'">'+ct.email+'</a></li></ul><p class="aviso-rodape">'+C.rodape.aviso+'</p></div>';
  $('#zap').href = 'https://wa.me/'+ct.whatsappNumero+'?text='+encodeURIComponent(ct.whatsappMensagem);

  // Modal da lista
  var modal = $('#modal');
  modal.innerHTML = '<div class="modal-in"><button type="button" class="fechar" aria-label="Fechar" data-fechar>×</button><h2 id="modal-titulo">'+C.formulario.tituloModal+'</h2><p>'+C.formulario.textoModal+'</p>'+form('lista','lista-de-espera','Entrar na lista')+'</div>';
  document.addEventListener('click',function(ev){
    if(ev.target.closest('[data-abrir-lista]')){ if(modal.showModal) modal.showModal(); }
    if(ev.target.closest('[data-fechar]') || ev.target===modal){ modal.close(); }
  });

  // Validação e envio
  function msg(form,id,txt){var el=$('#'+id+'-erro',form); if(el) el.textContent=txt||''; var i=$('#'+id,form); if(i) i.setAttribute('aria-invalid',txt?'true':'false');}
  function validar(form){
    var ok=true, ids={}; form.querySelectorAll('input[id]').forEach(function(i){ids[i.id.split('-')[1]]=i});
    var pref=Object.keys(ids).length&&form.querySelector('input[id]').id.split('-')[0];
    var nome=ids.nome.value.trim(), zap=ids.whatsapp.value.replace(/\D/g,''), mail=ids.email.value.trim();
    function chk(k,cond,t){msg(form,pref+'-'+k,cond?'':t); if(!cond) ok=false;}
    chk('nome',nome.length>=2,'Conte seu nome.');
    chk('whatsapp',zap.length>=10&&zap.length<=13,'Informe o WhatsApp com DDD.');
    chk('email',/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail),'Confira o e-mail.');
    chk('ok',ids.ok.checked,'Precisamos do seu aceite para entrar em contato.');
    if(!ok){var bad=form.querySelector('[aria-invalid="true"]'); if(bad) bad.focus();}
    return ok?{nome:nome,whatsapp:ids.whatsapp.value.trim(),email:mail,origem:form.dataset.origem}:null;
  }
  function enviar(d){
    if(ENV.provider==='none'){console.warn('[Plena] envio não configurado (js/config.js). Dados:',d);return Promise.resolve();}
    if(ENV.provider==='google'){
      var fd=new FormData(); Object.keys(ENV.googleCampos).forEach(function(k){fd.append(ENV.googleCampos[k],d[k])});
      return fetch(ENV.endpoint,{method:'POST',mode:'no-cors',body:fd});
    }
    return fetch(ENV.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(d)})
      .then(function(r){if(!r.ok) throw new Error(r.status)});
  }
  document.addEventListener('submit',function(ev){
    var form=ev.target; if(!form.classList.contains('form')) return; ev.preventDefault();
    var st=$('.status',form); st.textContent=''; st.className='status';
    if(form.elements.site&&form.elements.site.value) return;
    var d=validar(form); if(!d) return;
    var b=$('button[type=submit]',form); b.disabled=true;
    enviar(d).then(function(){form.reset();st.textContent=C.formulario.sucesso;st.classList.add('ok');})
      .catch(function(){st.textContent=C.formulario.erroEnvio;st.classList.add('falha');})
      .then(function(){b.disabled=false;});
  });
})();

</script>
</body>
</html>
