<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua proposta</title>
<style>
  body{margin:0;background:#faf7f2;color:#1d2129;font:15px/1.6 system-ui,sans-serif}
  .box{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  h1{font-family:Georgia,serif;font-weight:600;font-size:28px;margin:0 0 8px}
  p{color:#6b7280;margin:0}
  .spin{width:30px;height:30px;border:3px solid #e8e1d6;border-top-color:#a8844f;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="state"><div class="spin"></div><p>Abrindo a sua proposta…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js?v=1"></script>
<script src="js/quote-render.js?v=1"></script>
<script src="js/proposta.js?v=1"></script>
</body>
</html>
